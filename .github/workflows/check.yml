name: Check

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python -m pip install Pillow
      - run: npm run check
      - run: node tests/potato-preprocess.cjs
      - run: python -m unittest tests.test_inference_policy
      - run: |
          npm run preview -- --host 127.0.0.1 --port 4175 &
          curl --retry 30 --retry-connrefused --retry-delay 1 --fail --silent --show-error http://127.0.0.1:4175/ > /dev/null
          node tests/leaf-triage.cjs
          node tests/login-roles.cjs
          node tests/farmer-weather.cjs
          node tests/farmer-home-v2.cjs
          node tests/landing-motion.cjs
          node tests/farmer-field-first.cjs
          node tests/offline-pack.cjs
          node tests/marketplace-local.cjs
          node tests/potato-life-cycle.cjs
